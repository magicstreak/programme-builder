<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iterative Programme Builder</title>
<style>
:root{--primary:#2e7d32;--primary-hover:#1b5e20;--bg:#f8f9fa;--text:#212529;--card-bg:#fff;--border:#dee2e6;--warning:#f57c00}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}.container{max-width:850px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;border-bottom:2px solid var(--border);padding-bottom:15px}h1{color:var(--primary);margin:0}.btn{background:var(--primary);color:#fff;border:0;padding:10px 16px;border-radius:4px;cursor:pointer;font-weight:600;font-size:.95em}.btn:hover{background:var(--primary-hover)}.btn-secondary{background:#6c757d}.btn-secondary:hover{background:#5a6268}.btn-danger{background:#dc3545}.filter-section{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:25px;box-shadow:0 2px 4px #0000000d}.filter-title{font-weight:600;color:var(--primary);margin:0 0 15px}.filter-controls{display:grid;grid-template-columns:1fr 1fr auto auto;gap:12px;align-items:end}.filter-group{display:flex;flex-direction:column;gap:5px}.filter-group label{font-size:.85em;font-weight:600;color:#6c757d}input[type=date],input[type=time],input[type=text],textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:.95em;box-sizing:border-box}textarea{resize:vertical;min-height:80px}.filter-info{font-size:.85em;color:#6c757d;margin-top:12px}.schedule-list{display:flex;flex-direction:column;gap:20px}.schedule-item{background:var(--card-bg);border-left:6px solid var(--primary);border-radius:6px;padding:24px;box-shadow:0 4px 6px #0000000d;display:grid;grid-template-columns:160px 1fr;gap:20px;position:relative}.schedule-item.is-modified{border-left-color:var(--warning)}.schedule-item.is-editing{box-shadow:0 0 0 3px #2e7d3266}.walk-date{font-weight:bold;color:#495057;font-size:1.1em}.walk-time{font-size:.9em;color:#6c757d;margin-top:5px}.walk-title{font-size:1.35em;font-weight:700;margin:0 0 10px;color:var(--primary)}.schedule-item.is-modified .walk-title{color:#c60}.walk-meta{display:flex;gap:15px;font-size:.9em;color:#495057;margin-bottom:12px;flex-wrap:wrap}.meta-tag{background:#e8f5e9;padding:2px 8px;border-radius:4px;font-weight:500}.schedule-item.is-modified .meta-tag{background:#fff3e0}.walk-desc{font-size:.95em;line-height:1.6;color:#555;margin:0}.badge{font-size:.7em;padding:3px 8px;border-radius:12px;font-weight:600;margin-left:10px;display:inline-block}.badge-modified{background:#fff3cd;color:#856404;border:1px solid #ffeeba}.card-actions{position:absolute;top:20px;right:20px}.edit-form{display:flex;flex-direction:column;gap:12px}.form-group{display:flex;flex-direction:column;gap:5px}.form-group label{font-size:.85em;font-weight:600;color:#6c757d}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.edit-buttons{display:flex;gap:10px;margin-top:5px}.empty-state{text-align:center;padding:40px 20px;color:#6c757d}@media(max-width:650px){header{display:block}.header-actions{margin-top:15px}.schedule-item{grid-template-columns:1fr;gap:15px;padding-top:50px}.card-actions{top:15px;right:15px}.form-row,.filter-controls{grid-template-columns:1fr}.filter-controls .btn{width:100%}}
</style>
</head>
<body>
<div class="container">
<header><div><h1>🗺️ CBMW Programme Builder</h1><p style="color:#6c757d;margin:5px 0">Choose a date range and click “Create Programme”.</p></div><div class="header-actions"><button class="btn" onclick="exportData()">💾 Export JSON</button></div></header>
<section class="filter-section"><div class="filter-title">📅 Create Programme for a Date Range</div><div class="filter-controls"><div class="filter-group"><label for="filter-from">From date</label><input type="date" id="filter-from"></div><div class="filter-group"><label for="filter-to">To date</label><input type="date" id="filter-to"></div><button class="btn" onclick="createProgramme()">Create Programme</button><button class="btn btn-secondary" onclick="clearFilter()">Show All</button></div><div class="filter-info" id="filter-info">Select both dates, then click Create Programme.</div></section>
<div id="schedule" class="schedule-list"></div>
</div>
<script>
const walkDatabase={W_001:{title:'Riverside Nature Trail',distance:'5.2 miles',difficulty:'Easy',description:'A scenic, flat walk alongside the riverbank. Great for bird spotting.'},W_002:{title:'Mountain Ridge Trek',distance:'8.5 miles',difficulty:'Hard',description:'A strenuous climb up the rocky north ridge with panoramic views.'}};
let calendarSchedule=[{id:0,date:'2026-10-03',time:'10:00',walkid:'W_001'},{id:1,date:'2026-10-10',time:'09:30',walkid:'W_002',overrides:{distance:'6.0 miles (Valley Route)',description:'Diverting through valley due to wind alerts on the ridge.'}},{id:2,date:'2026-10-17',time:'11:00',walkid:'W_001'}];
let currentEditingId=null, activeFrom='', activeTo='';
function formatTime(value){if(!value)return'N/A';const m=/^([01]\d|2[0-3]):([0-5]\d)$/.exec(value);if(!m)return value;const h=+m[1],suffix=h>=12?'PM':'AM';return`${((h+11)%12)+1}:${m[2]} ${suffix}`}
function formatDate(value){if(!value)return'No Date';return new Date(value+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function createProgramme(){const from=document.getElementById('filter-from').value,to=document.getElementById('filter-to').value;if(!from||!to){setInfo('Please select both a From date and a To date.',true);return}if(from>to){setInfo('The From date must be on or before the To date.',true);return}activeFrom=from;activeTo=to;setInfo(`Programme created: ${formatDate(from)} to ${formatDate(to)}.`);renderSchedule()}
function clearFilter(){activeFrom='';activeTo='';document.getElementById('filter-from').value='';document.getElementById('filter-to').value='';setInfo('Showing all scheduled walks.');renderSchedule()}
function setInfo(message,error=false){const el=document.getElementById('filter-info');el.textContent=message;el.style.color=error?'#dc3545':'#6c757d'}
function getSchedule(){return calendarSchedule.filter(s=>(!activeFrom||s.date>=activeFrom)&&(!activeTo||s.date<=activeTo)).sort((a,b)=>a.date.localeCompare(b.date))}
function renderSchedule(){const container=document.getElementById('schedule');container.innerHTML='';const schedule=getSchedule();if(!schedule.length){container.innerHTML='<div class="empty-state"><p>📭 No walks are scheduled in this date range.</p></div>';return}schedule.forEach(slot=>{const base=walkDatabase[slot.walkid]||{},o=slot.overrides||{},modified=Object.keys(o).length>0,title=o.title||base.title||'Unknown Walk',distance=o.distance||base.distance||'N/A',difficulty=o.difficulty||base.difficulty||'N/A',description=o.description||base.description||'',time=o.time||slot.time||'N/A',item=document.createElement('div');item.className=`schedule-item ${modified?'is-modified':''} ${currentEditingId===slot.id?'is-editing':''}`;if(currentEditingId===slot.id){item.innerHTML=`<div><div class="walk-date">${formatDate(slot.date)}</div><div class="walk-time">⏰ ${formatTime(slot.time)}</div></div><div class="edit-form"><div class="form-row"><div class="form-group"><label>Date</label><input type="date" value="${slot.date}" readonly></div><div class="form-group"><label>Time Override</label><input type="time" id="edit-time-${slot.id}" value="${o.time||slot.time||''}"></div></div><div class="form-group"><label>Title Override</label><input type="text" id="edit-title-${slot.id}" value="${o.title||''}" placeholder="Master: ${base.title||''}"></div><div class="form-row"><div class="form-group"><label>Distance Override</label><input type="text" id="edit-distance-${slot.id}" value="${o.distance||''}" placeholder="Master: ${base.distance||''}"></div><div class="form-group"><label>Difficulty Override</label><input type="text" id="edit-difficulty-${slot.id}" value="${o.difficulty||''}" placeholder="Master: ${base.difficulty||''}"></div></div><div class="form-group"><label>Description Override</label><textarea id="edit-desc-${slot.id}" placeholder="Master: ${base.description||''}">${o.description||''}</textarea></div><div class="edit-buttons"><button class="btn" onclick="saveOverride(${slot.id})">Save Changes</button><button class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>${modified?`<button class="btn btn-danger" onclick="resetToMaster(${slot.id})">Reset to Master</button>`:''}</div></div>`}else{item.innerHTML=`<div><div class="walk-date">${formatDate(slot.date)}</div><div class="walk-time">⏰ ${formatTime(time)}</div></div><div><div class="card-actions"><button class="btn btn-secondary" style="padding:5px 10px;font-size:.85em" onclick="enterEditMode(${slot.id})">✏️ Edit Card</button></div><h2 class="walk-title">${title}${modified?'<span class="badge badge-modified">Modified</span>':''}</h2><div class="walk-meta"><span>📏 <strong>Distance:</strong> ${distance}</span><span>🥾 <strong>Difficulty:</strong> <span class="meta-tag">${difficulty}</span></span></div><p class="walk-desc">${description||'<em>No description available.</em>'}</p></div>`}container.appendChild(item)})}
function enterEditMode(id){currentEditingId=id;renderSchedule()}function cancelEdit(){currentEditingId=null;renderSchedule()}
function saveOverride(id){const slot=calendarSchedule.find(s=>s.id===id);if(!slot)return;const fields={time:'edit-time-',title:'edit-title-',distance:'edit-distance-',difficulty:'edit-difficulty-',description:'edit-desc-'},over={};Object.entries(fields).forEach(([key,prefix])=>{const value=document.getElementById(prefix+id).value.trim();if(value)over[key]=value});if(Object.keys(over).length)slot.overrides={...(slot.overrides||{}),...over};else delete slot.overrides;if(over.time)slot.time=over.time;currentEditingId=null;renderSchedule()}
function resetToMaster(id){const slot=calendarSchedule.find(s=>s.id===id);if(slot)delete slot.overrides;currentEditingId=null;renderSchedule()}
function exportData(){const data=getSchedule();const url='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2)),link=document.createElement('a');link.href=url;link.download='programme_schedule_output.json';document.body.appendChild(link);link.click();link.remove()}
window.onload=renderSchedule;
</script>
</body>
</html>
